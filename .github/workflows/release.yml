name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package
        run: zip -r hermes-in-chrome.zip dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-in-chrome.zip
          generate_release_notes: true
